# HTTP Header Configuration for Maximum Performance
# Aggressive caching and compression for 99-100 Lighthouse score

[build]
command = "npm run build"
publish = "dist"

# Root page - revalidate frequently
[[headers]]
for = "/"
[headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"
  X-XSS-Protection = "1; mode=block"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Content-Encoding = "gzip, br"

# Assets with hash - cache forever
[[headers]]
for = "/assets/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable, stale-while-revalidate=604800"
  X-Content-Type-Options = "nosniff"
  Content-Encoding = "gzip, br"

# HTML files - always revalidate
[[headers]]
for = "*.html"
[headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  X-Content-Type-Options = "nosniff"
  Content-Type = "text/html; charset=utf-8"
  Content-Encoding = "gzip, br"

# JavaScript - aggressive caching for versioned files
[[headers]]
for = "*.js"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable, stale-while-revalidate=604800"
  Content-Type = "application/javascript; charset=utf-8"
  Content-Encoding = "gzip, br"

# CSS - aggressive caching for versioned files
[[headers]]
for = "*.css"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable, stale-while-revalidate=604800"
  Content-Type = "text/css; charset=utf-8"
  Content-Encoding = "gzip, br"

# Images - 1 year cache
[[headers]]
for = "/assets/*.png"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable, stale-while-revalidate=604800"
  Content-Type = "image/png"
  Content-Encoding = "gzip, br"

[[headers]]
for = "/assets/*.jpg"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable, stale-while-revalidate=604800"
  Content-Type = "image/jpeg"
  Content-Encoding = "gzip, br"

[[headers]]
for = "/assets/*.svg"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable, stale-while-revalidate=604800"
  Content-Type = "image/svg+xml"
  Content-Encoding = "gzip, br"

[[headers]]
for = "/assets/*.webp"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable, stale-while-revalidate=604800"
  Content-Type = "image/webp"
  Content-Encoding = "gzip, br"

# Redirect rules for SPA
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = false

# Environment for compression
[context.production.environment]
NODE_ENV = "production"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
  Content-Type = "image/svg+xml"

[[headers]]
for = "*.json"
[headers.values]
  Cache-Control = "public, max-age=3600"
  Content-Type = "application/json; charset=utf-8"
