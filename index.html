<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Critical Resource Preloads - High Priority -->
    <link rel="preload" as="script" href="/src/main.tsx" />
    
    <!-- Image Preloads with Priority Hints -->
    <link rel="preload" href="/src/assets/logo.svg" as="image" fetchpriority="high" />

    <!-- Apply the stored theme before paint (dark by default) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('airbridge-theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    
    <!-- Font Optimization - System fonts (no Google Fonts for speed) -->
    <style>
      /* Use system font stack - fastest possible loading */
      html {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
    
    <!-- Prefetch DNS for external services -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <title>Airbridge — Food Technology & AI Infrastructure</title>
    
    <!-- Meta for SEO and sharing -->
    <meta name="description" content="Airbridge builds digital infrastructure for restaurants and food businesses — websites, POS integrations, AI systems and LLM cost optimization.">
    <meta name="theme-color" content="#070707" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Airbridge — Food Technology & AI Infrastructure" />
    <meta property="og:description" content="Airbridge builds digital infrastructure for restaurants and food businesses — websites, POS integrations, AI systems and LLM cost optimization." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Defer non-critical module script -->
    <script type="module" src="/src/main.tsx" defer></script>
    
    <!-- Inject web vitals measurement inline to reduce impact -->
    <script>
      // Minimal Web Vitals tracking - deferred until after load
      window.addEventListener('load', () => {
        setTimeout(() => {
          try {
            // Only load analytics after page interactive
            if (typeof window.dataLayer !== 'undefined') {
              console.log('Page interactive - analytics ready');
            }
          } catch (e) {}
        }, 3000);
      }, { once: true });
    </script>
  </body>
</html>
